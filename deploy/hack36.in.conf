# hack36.in - static Next.js export served from /var/www/hack36.in/html.
# Certificate managed by Certbot; keep the ssl_* lines in place on renewal.
server {

    server_name hack36.in www.hack36.in;

    root /var/www/hack36.in/html;
    index index.html;

    # Next.js emits content-hashed files under /_next/static, safe to pin.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML must revalidate so a deploy is visible immediately. $uri.html keeps
    # future exported routes working without a rewrite.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hack36.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hack36.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.hack36.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = hack36.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name hack36.in www.hack36.in;
    return 404; # managed by Certbot
}
